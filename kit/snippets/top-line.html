<!-- ember-kit top line for a page you write yourself: the brand on the left, the theme switch on the right, a hairline under it.
     Paste this whole file as the first thing inside <body class="kit">, then change the brand words. It includes the theme switch. -->

<style>
.top-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; margin-bottom: clamp(28px, 4vw, 48px); border-bottom: 1px solid var(--line); font: 500 14px/1 Inter, system-ui, sans-serif; color: var(--ink); }
.top-line b { font-weight: 600; }
</style>
<header class="top-line"><b>Brand name</b><div>
<style>
.thm { position: relative; display: inline-grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
.thm button { position: relative; z-index: 1; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: none; font: 500 12.5px/1 Inter, system-ui, sans-serif; color: var(--muted); cursor: pointer; transition: color .18s var(--ease-out); }
.thm button:hover { color: var(--ink); }
.thm button[aria-pressed="true"] { color: var(--paper); }
.thm button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the marker is one button wide (equal columns), so only transform moves */
.thm i { position: absolute; z-index: 0; top: 3px; left: 3px; height: 28px; width: calc((100% - 10px) / 3); border-radius: 7px; background: var(--ink); transition: transform .37s var(--sp-snappy, cubic-bezier(.34, 1.3, .64, 1)); }
.thm button:active { transform: scale(.97); }
html[data-motion="off"] .thm i, html[data-motion="off"] .thm button { transition: none; }
/* phones: one round button that flips light and night, so the title keeps its room */
.thm-flip { display: none; width: 34px; height: 34px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-raised); color: var(--ink-soft); cursor: pointer; transition: color .18s var(--ease-out), transform .15s var(--ease-out); }
.thm-flip:hover { color: var(--ink); }
.thm-flip:active { transform: scale(.97); }
.thm-flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thm-flip svg { width: 16px; height: 16px; }
@media (max-width: 559px) { .thm { display: none; } .thm-flip { display: inline-grid; } }
</style>

<div class="thm" role="group" aria-label="Theme">
  <i aria-hidden="true"></i>
  <button type="button" data-thm="system" aria-pressed="false">System</button>
  <button type="button" data-thm="light" aria-pressed="false">Light</button>
  <button type="button" data-thm="dark" aria-pressed="false">Night</button>
</div>
<button type="button" class="thm-flip" aria-label="Switch to night theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>

<script>
(function () {
  var flip = document.querySelector('.thm-flip'), box = document.querySelector('.thm'), mark = box.querySelector('i'), mq = matchMedia('(prefers-color-scheme: dark)');
  function saved() { try { return localStorage.getItem('ember-theme-v1') || 'system'; } catch (e) { return 'system'; } }
  function apply(pick, glide) {
    try { localStorage.setItem('ember-theme-v1', pick); } catch (e) {}
    document.documentElement.setAttribute('data-theme', pick === 'system' ? (mq.matches ? 'dark' : 'light') : pick);
    var on = box.querySelector('[data-thm="' + pick + '"]');
    box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === on)); });
    flip.setAttribute('aria-label', document.documentElement.getAttribute('data-theme') === 'dark' ? 'Switch to light theme' : 'Switch to night theme');
    if (!glide) mark.style.transition = 'none';
    mark.style.transform = 'translateX(' + (on.offsetLeft - 3) + 'px)';
    if (!glide) { mark.offsetWidth; mark.style.transition = ''; }
  }
  flip.addEventListener('click', function () { apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true); });
  box.addEventListener('click', function (e) { var b = e.target.closest('[data-thm]'); if (b) apply(b.getAttribute('data-thm'), true); });
  mq.addEventListener('change', function () { if (saved() === 'system') apply('system', true); });
    apply(saved(), false);
})();
</script>
</div></header>

name: Showcase site

# Publishes the showcase (components/showcase/index.html) as the kit's web page.
# The showcase is the master copy, so the site is that file as-is: no build step.
on:
  push:
    branches: [main]
    paths:
      - "components/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: components/showcase
      - id: deployment
        uses: actions/deploy-pages@v4

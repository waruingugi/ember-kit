        var xt = ((ax * t + bx) * t + cx) * t - x, dx = (3 * ax * t + 2 * bx) * t + cx;

  var speed = function () { var l = document.documentElement.dataset.motion; return l === "off" ? 0 : l === "calm" ? .5 : 1; };

  var se = { wrap: $("sWrap"), svg: $("ssvg"), grid: $("sGrid"), area: $("sArea"), line: $("sLine"), lead: $("sLead"), cross: $("sCross"), dot: $("sDot"),
    hit: $("sHit"), clip: $("sClipRect"), tip: $("sTip"), tipD: $("sTipD"), tipV: $("sTipV"), now: $("sNow"), delta: $("sDelta"), range: $("sRange"),
    mark: $("sMark"), name: $("sRangeName"), rows: $("sRows"), table: $("sTableView") };
  var s = { w: 0, range: "30D", from: model["30D"].ny, to: model["30D"].ny, e: 1, morph: null, r: 0, reveal: null, started: false,
    hover: null, cx: 0, cxS: 0, raf: 0, last: 0 };

  var sgeom = function () { return { iw: Math.max(1, s.w - SP.l - SP.r), ih: SH - SP.t - SP.b }; };
  var disp = function (k) { return s.from[k] + (s.to[k] - s.from[k]) * s.e; };
  function curve() {
    var g = sgeom(), pts = [];

  }
  function pathOf(c) {
    var p = c.pts, m = c.m, P = function (x, y) { return x.toFixed(2) + " " + y.toFixed(2); }, d = "M" + P(p[0].t, p[0].v);
    for (var k = 0; k < p.length - 1; k++) {

      d += "C" + P(p[k].t + h / 3, p[k].v + m[k] * h / 3) + " " + P(p[k + 1].t - h / 3, p[k + 1].v - m[k + 1] * h / 3) + " " + P(p[k + 1].t, p[k + 1].v);
    }

  }

  function drawS() {
    if (!s.w) return;
    var g = sgeom(), c = curve(), d = pathOf(c), base = SP.t + g.ih;
    se.line.setAttribute("d", d);
    se.area.setAttribute("d", d + "L" + (SP.l + g.iw).toFixed(2) + " " + base + "L" + SP.l + " " + base + "Z");
    se.clip.setAttribute("width", s.r >= .999 ? s.w : SP.l + g.iw * s.r);
    var lx = SP.l + g.iw * s.r;
    se.lead.setAttribute("cx", lx);
    se.lead.setAttribute("cy", valueAt(c.pts, lx, c.m));
    se.lead.setAttribute("opacity", s.r > .02 && s.r < .96 ? 1 : 0);
    if (s.hover !== null) {
      se.cross.setAttribute("x1", s.cxS); se.cross.setAttribute("x2", s.cxS);
      se.dot.setAttribute("cx", s.cxS); se.dot.setAttribute("cy", valueAt(c.pts, s.cxS, c.m));
      se.tip.style.transform = "translateX(" + Math.round(clamp(s.cxS - TIP_W / 2, 0, Math.max(0, s.w - TIP_W))) + "px)";
    }
  }
  function stepS(now) {
    s.raf = 0;
    var dt = Math.min(now - s.last, 100), busy = false, p;
    s.last = now;
    if (s.reveal) {
      p = clamp((now - s.reveal.start) / s.reveal.dur, 0, 1);
      s.r = ease(p);
      if (p < 1) busy = true; else { s.reveal = null; s.r = 1; }
    }
    if (s.morph) {
      p = clamp((now - s.morph.start) / s.morph.dur, 0, 1);
      s.e = ease(p);
      if (p < 1) busy = true; else { s.morph = null; s.e = 1; }
    }
    if (s.hover !== null) {
      // the dot glides to the snapped day without overshooting

      if (Math.abs(s.cx - s.cxS) > .3) busy = true; else s.cxS = s.cx;
    }

    if (busy) kickS();
  }
  function kickS() { if (s.raf) return; s.last = performance.now(); s.raf = requestAnimationFrame(stepS); }

  function gridS(fade) {
    var g = sgeom(), m = model[s.range], len = m.pts.length;
    var ng = document.createElementNS(NS, "g");
    ng.setAttribute("class", "gl");
    var add = function (tag, attrs, text) {
      var n = document.createElementNS(NS, tag);
      for (var a in attrs) n.setAttribute(a, attrs[a]);
      if (text != null) n.textContent = text;
      ng.appendChild(n);
    };
    m.ticks.forEach(function (x) {
      var y = SP.t + (1 - (x - m.lo) / (m.hi - m.lo)) * g.ih;
      add("line", { x1: SP.l, x2: s.w - SP.r, y1: y, y2: y });
      add("text", { "class": "tick", x: SP.l - 10, y: y, "text-anchor": "end", "dominant-baseline": "middle" }, fmtCompact.format(x));
    });
    var narrow = s.w < 380, count = narrow ? 3 : s.w < 520 ? 4 : 5, axis = axisFmt(len, narrow), idxs = [];
    for (var j = 0; j < count; j++) { var ix = Math.round((j / (count - 1)) * (len - 1)); if (idxs.indexOf(ix) < 0) idxs.push(ix); }
    idxs.forEach(function (ix, j) {
      add("text", { "class": "tick", x: SP.l + (ix / (len - 1)) * g.iw, y: SH - 6, "text-anchor": j === 0 ? "start" : j === idxs.length - 1 ? "end" : "middle" },
        axis.format(m.pts[ix].date));
    });
    if (fade && speed()) {
      Array.prototype.forEach.call(se.grid.children, function (old) { old.style.opacity = 0; setTimeout(function () { old.remove(); }, 260); });
      ng.style.opacity = 0;
      se.grid.appendChild(ng);
      ng.getBoundingClientRect();
      ng.style.opacity = 1;
    } else {
      se.grid.textContent = "";
      se.grid.appendChild(ng);
    }
  }

  function headerS() {
    var m = model[s.range], len = m.pts.length, shown = m.pts[s.hover === null ? len - 1 : s.hover];
    var dl = (shown.value - m.pts[0].value) / m.pts[0].value;
    se.now.textContent = fmtFull.format(shown.value);
    se.delta.innerHTML = "<b>" + (dl >= 0 ? "▲ " : "▼ ") + Math.abs(dl * 100).toFixed(1) + "%</b> " +
      (s.hover !== null ? "by " + fmtTip.format(shown.date) : "over the last " + RANGE_NAME[s.range]);
  }
  function rowsS() {
    var pts = model[s.range].pts, html = "";
    // a year has 365 days: the table shows the first day of each month instead
    var pick = pts.length > 40 ? pts.filter(function (p) { return new Date(p.date).getUTCDate() === 1; }) : pts;
    pick.forEach(function (p) { html += "<tr><td>" + fmtTip.format(p.date) + "</td><td>" + fmtFull.format(p.value) + "</td></tr>"; });
    se.rows.innerHTML = html;
  }
  se.table.addEventListener("toggle", function () { if (se.table.open) rowsS(); });
  function labelS() {
    var m = model[s.range], len = m.pts.length;
    se.name.textContent = RANGE_NAME[s.range] === "year" ? "1 year" : RANGE_NAME[s.range];
    se.svg.setAttribute("aria-label", "Revenue over the last " + RANGE_NAME[s.range] + ": from " + fmtFull.format(m.pts[0].value) + " to " +
      fmtFull.format(m.pts[len - 1].value) + ". Use the left and right arrow keys to read each day.");
  }
  function tabsS() {
    var on = se.range.querySelector('[data-r="' + s.range + '"]');
    se.range.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === on)); });
    se.mark.style.transform = "translateX(" + (on.offsetLeft - 3) + "px)";
  }

  function changeRange(next) {
    if (next === s.range || !model[next]) return;
    var cur = new Float64Array(SN);
    for (var k = 0; k < SN; k++) cur[k] = disp(k); // start from what is on screen, so a second click mid-morph stays smooth
    s.from = cur; s.to = model[next].ny; s.range = next;
    if (speed()) { s.e = 0; s.morph = { start: performance.now(), dur: 550 * speed() }; } else { s.e = 1; s.morph = null; }
    clearS();
    gridS(true); headerS(); tabsS(); labelS();
    if (se.table.open) rowsS();
    kickS();
  }
  se.range.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-r]");
    if (b) changeRange(b.dataset.r);
  });

  function moveTo(idx) {
    var m = model[s.range], len = m.pts.length, g = sgeom();
    var target = SP.l + (len > 1 ? idx / (len - 1) : .5) * g.iw;
    s.cx = target;
    if (s.hover === null) s.cxS = target; // first hover: appear in place, don't sweep in
    s.hover = idx;
    se.wrap.dataset.hover = "1";
    se.tipD.textContent = fmtTip.format(m.pts[idx].date);
    se.tipV.textContent = fmtFull.format(m.pts[idx].value);

    kickS();
  }
  function clearS() {
    if (s.hover === null) return;
    s.hover = null;
    se.wrap.dataset.hover = "0";
    headerS();
  }
  function scrub(e) {
    var box = se.svg.getBoundingClientRect(), len = model[s.range].pts.length;

    moveTo(Math.round(frac * (len - 1)));
  }
  se.hit.addEventListener("pointermove", scrub);
  se.hit.addEventListener("pointerdown", scrub);
  se.hit.addEventListener("pointerleave", clearS);
  se.svg.addEventListener("keydown", function (e) {
    var len = model[s.range].pts.length;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      moveTo(clamp((s.hover === null ? len - 1 : s.hover) + (e.key === "ArrowRight" ? 1 : -1), 0, len - 1));
    } else if (e.key === "Escape") clearS();
  });
  se.svg.addEventListener("blur", clearS);

  function sizeS(w) {
    s.w = w;
    se.svg.setAttribute("width", w); se.svg.setAttribute("height", SH);
    se.hit.setAttribute("width", w); se.hit.setAttribute("height", SH);
    se.clip.setAttribute("height", SH);
    se.cross.setAttribute("y1", SP.t - 6); se.cross.setAttribute("y2", SH - SP.b);
    if (s.hover !== null) { var keep = s.hover; s.hover = null; moveTo(keep); }
    gridS(false); tabsS(); drawS();
  }
  new ResizeObserver(function (entries) {
    var w = Math.round(entries[0].contentRect.width);
    if (w && w !== s.w) sizeS(w);
  }).observe(se.wrap);
  sizeS(Math.round(se.wrap.getBoundingClientRect().width) || 640);
  headerS(); labelS();

  // the line draws in once, from left to right, when 40% of the chart is on screen
  function revealS() {
    if (s.started) return;
    s.started = true;
    if (!speed()) { s.r = 1; drawS(); return; }
    s.reveal = { start: performance.now(), dur: 1100 * speed() };
    kickS();
  }
  var sio = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { revealS(); sio.disconnect(); } }, { threshold: .4 });
  sio.observe(se.wrap);
})();
</script>

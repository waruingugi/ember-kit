          <p class="kit-p">Watch the visitor count. Only the digits that change will roll.</p>

  <div class="frame"><div class="fbody"><div class="stage">
    <div class="hd"><span class="live" aria-hidden="true"></span><span class="label">Visitors on the site now</span></div>

  </div></div></div>

</section>
        </div>
<script data-slot="0010">
(function () {
  "use strict";
  var box = document.getElementById("n07"); if (!box) return;
  var spd = function () { var m = document.documentElement.dataset.motion || "lively"; if (matchMedia("(prefers-reduced-motion: reduce)").matches) m = "off"; return m === "off" ? 0 : m === "calm" ? .5 : 1; };
  var num = box.querySelector("#n07-num"), chg = box.querySelector("#n07-chg"), strips = [], value = 1284, vis = true, i, s = "";
  for (i = 0; i < 10; i++) s += "<span>" + i + "</span>";

    var c = document.createElement("div"); c.className = "dg"; c.innerHTML = '<span class="st7" aria-hidden="true">' + s + "</span>"; strips.push(c.firstChild);

</script>

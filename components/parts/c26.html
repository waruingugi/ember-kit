<script data-slot="0006" data-block="0023">
  /* ---------------- 26 reveal card: lift + tilt (mouse) and a warm tint under the pointer ---------------- */
  document.querySelectorAll(".rc").forEach(function (card) {
    var tint = card.querySelector(".rc-tint i");
    function centre() { tint.style.transform = "translate(" + card.offsetWidth / 2 + "px," + card.offsetHeight / 2 + "px)"; }
    centre();
    card.addEventListener("pointermove", function (e) {
      var r = card.getBoundingClientRect();
      if (lvl() !== "off") tint.style.transform = "translate(" + (e.clientX - r.left) + "px," + (e.clientY - r.top) + "px)";
      if (e.pointerType !== "mouse" || lvl() === "off") return;
      var deg = lvl() === "calm" ? 2 : 4, lift = lvl() === "calm" ? 1.5 : 3;
      var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transition = "transform .15s " + EASE;
      card.style.transform = "translateY(-" + lift + "px) rotateX(" + (-y * deg).toFixed(2) + "deg) rotateY(" + (x * deg).toFixed(2) + "deg)";
    });
    card.addEventListener("pointerleave", function () { card.style.transition = ""; card.style.transform = ""; centre(); });
  });
</script>

<!-- part c04 | part | group fields | Dots that step aside. | Dots that step aside. -->
<div class="kit kit-part">
          <h3 class="kit-h">Dots that <em>step aside.</em></h3>
          <p class="kit-p">Move your pointer over the field. Dots near it turn orange and step aside, then settle back.</p>
          <section class="cs" id="c04">
    <div class="frame">
      <div class="fbar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="t">Background field</span></div>
      <div class="fbody">
        <div class="df" id="df"><canvas id="dfCanvas" aria-hidden="true"></canvas><div class="df-c"><span class="label">Behind a hero</span><p>Quiet until <em>you move</em>.</p></div></div>
      </div>
    </div>
</section>
        </div>
<script data-slot="0007" data-block="0001">
  /* ---------------- 04 dot field ---------------- */
  (function () {
    var box = $("df"), cv = $("dfCanvas"), ctx = cv.getContext("2d");
    var GAP = 18, R = 110, dots = [], p = null, running = false, w = 0, h = 0;
    var DIM = [146, 154, 158], ACC = [225, 74, 14];
    function build() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      w = box.clientWidth; h = box.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = [];
      for (var y = GAP / 2; y < h; y += GAP) for (var x = GAP / 2; x < w; x += GAP) dots.push({ x: x, y: y, ox: 0, oy: 0, k: 0 });
      paint();
    }
    function paint() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i], k = d.k;
        ctx.fillStyle = "rgb(" + Math.round(DIM[0] + (ACC[0] - DIM[0]) * k) + "," + Math.round(DIM[1] + (ACC[1] - DIM[1]) * k) + "," + Math.round(DIM[2] + (ACC[2] - DIM[2]) * k) + ")";
        ctx.beginPath(); ctx.arc(d.x + d.ox, d.y + d.oy, 1.1 + k * 1.2, 0, 6.2832); ctx.fill();
      }
    }
    function step() {
      var busy = false, push = 16 * spd();
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i], tx = 0, ty = 0, tk = 0;
        if (p) {
          var dx = d.x - p.x, dy = d.y - p.y, dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < R) { var f = 1 - dist / R; tx = dx / dist * f * f * push; ty = dy / dist * f * f * push; tk = f; }
        }
        d.ox += (tx - d.ox) * .18; d.oy += (ty - d.oy) * .18; d.k += (tk - d.k) * .2;
        if (Math.abs(tx - d.ox) > .05 || Math.abs(ty - d.oy) > .05 || Math.abs(tk - d.k) > .01) busy = true;
      }
      paint();
      if (busy) requestAnimationFrame(step); else running = false;
    }
    function kick() { if (!running) { running = true; requestAnimationFrame(step); } }
    box.addEventListener("pointermove", function (e) {
      if (!spd()) return;
      var r = box.getBoundingClientRect(); p = { x: e.clientX - r.left, y: e.clientY - r.top }; kick();
    });
    box.addEventListener("pointerleave", function () { p = null; kick(); });
    build();
    if ("ResizeObserver" in window) new ResizeObserver(function () { if (box.clientWidth !== w || box.clientHeight !== h) build(); }).observe(box);
  })();
</script>

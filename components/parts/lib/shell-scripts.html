    .from('.hero .lead', { y: 20, autoAlpha: 0 }, '-=0.9')
    .from('.hero .meta-row', { y: 14, autoAlpha: 0 }, '-=0.85')
    .from('.route-card', { y: 32, autoAlpha: 0, scale: 0.98 }, '-=1.15')
    .from('.scroll-cue', { autoAlpha: 0 }, '-=0.6');

  /* 2. Reveals: things that enter together come in as one staggered group */
  var items = gsap.utils.toArray('[data-reveal]').filter(function (el) { return !el.closest('.hero') && !el.classList.contains('goal'); });
  gsap.set(items, { autoAlpha: 0, y: 26 });

  /* 2b. Goal rows follow the scroll both ways: in as they arrive, and a quiet fade out as they
     leave the screen, up or down, so going back feels as alive as going forward. */
  var gy = L.lively() ? 18 : 8;
  gsap.utils.toArray('.goal[data-reveal]').forEach(function (goal) {
    gsap.set(goal, { autoAlpha: 0, y: gy });
    /* Ease in and out, slower than other reveals, so each row settles in calmly instead of snapping. */
    function show() { gsap.to(goal, { autoAlpha: 1, y: 0, duration: 1.4, ease: 'power2.inOut', overwrite: true }); }
    function hide(y) { gsap.to(goal, { autoAlpha: 0, y: y, duration: 1, ease: 'power2.inOut', overwrite: true }); }
    ScrollTrigger.create({ trigger: goal, start: 'top 92%', end: 'bottom top+=72',
      onEnter: show, onEnterBack: show,
      onLeave: function () { hide(-gy); }, onLeaveBack: function () { hide(gy); } });
  });
  ScrollTrigger.batch(items, {
    start: 'top 90%', once: true,
    onEnter: function (batch) { gsap.to(batch, { autoAlpha: 1, y: 0, duration: 1, ease: EASE, stagger: 0.08, overwrite: true, onComplete: function () { done(batch); } }); }
  });

  /* 3. Ghost numbers drift slower than the page (Lively only) */
  if (L.lively()) {
    window.__gsapGhosts = true;
    gsap.utils.toArray('.ghost').forEach(function (g) {
      gsap.fromTo(g, { yPercent: 14 }, { yPercent: -16, ease: 'none', scrollTrigger: { trigger: g.parentNode, start: 'top bottom', end: 'bottom top', scrub: true } });
    });
  }

  /* 4. Four layers: the same explode, scrubbed with a little inertia */
  var mm = gsap.matchMedia();
  if (document.getElementById('layersPin')) mm.add('(min-width: 1101px)', function () {
    var proxy = { p: 0 };
    window.__gsapLayersP = 0;
    gsap.to(proxy, { p: 1, ease: 'none', onUpdate: function () { window.__gsapLayersP = proxy.p; L.updateLayers(); },
      scrollTrigger: { trigger: '#layersPin', start: 'top top+=64', end: 'bottom bottom', scrub: 0.9 } });
    return function () { window.__gsapLayersP = null; L.updateLayers(); };
  });

  /* 5. Delivery: the spine follows the scroll smoothly, and each step pops as the line reaches it */
  var fp = { p: 0 };
  window.__gsapFlowP = 0;
  if (document.getElementById('flow')) gsap.to(fp, { p: 1, ease: 'none', onUpdate: function () { window.__gsapFlowP = fp.p; L.updateFlow(); },
    scrollTrigger: { trigger: '#flow', start: 'top 55%', end: 'bottom 55%', scrub: 0.6 } });
  gsap.utils.toArray('#flow .flow-step').forEach(function (step, i) {
    var dot = step.querySelector('.fdot'), card = step.querySelector('.fcard'), side = i % 2 ? 12 : -12;
    var k = L.lively() ? 1 : 0.5;
    gsap.timeline({ scrollTrigger: { trigger: card, start: 'top bottom', end: 'bottom top', scrub: 0.5 } })
      .fromTo(card, { opacity: 0, x: side * 5 * k, y: 40 * k, scale: 1 - 0.06 * k, rotation: (i % 2 ? 1.5 : -1.5) * k }, { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.45, ease: 'power3.out' })
      .to(card, { opacity: 1, duration: 0.3 })
      .to(card, { opacity: 0.3, y: -16 * k, duration: 0.3, ease: 'power1.in' });
    ScrollTrigger.create({
      trigger: dot, start: 'center 55%',
      onEnter: function () { gsap.fromTo(dot, { scale: 0.7 }, { scale: 1.06, duration: 0.6, ease: 'back.out(3)', overwrite: true }); },
      onLeaveBack: function () { gsap.to(dot, { scale: 1, duration: 0.3, overwrite: true }); }
    });
  });

  /* 6. Diagrams: boxes first, then the lines draw, then the labels */
  ['#er', '#sm'].forEach(function (sel) {
    var svg = document.querySelector(sel); if (!svg) return;
    var ents = svg.querySelectorAll('.ent'), solid = svg.querySelectorAll('.rel:not(.dash)'), dash = svg.querySelectorAll('.rel.dash'), lbls = svg.querySelectorAll('.lbls');
    gsap.set(ents, { autoAlpha: 0, y: 10 }); gsap.set(solid, { strokeDashoffset: 1 }); gsap.set(lbls, { autoAlpha: 0 });
    var tl = gsap.timeline({ scrollTrigger: { trigger: svg, start: 'top 75%', once: true } })
      .to(ents, { autoAlpha: 1, y: 0, duration: 0.7, ease: EASE, stagger: 0.09 })
      .to(solid, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut', stagger: 0.1 }, '-=0.3');
    if (dash.length) { gsap.set(dash, { opacity: 0 }); tl.to(dash, { opacity: 1, duration: 0.5 }, '-=0.4'); }
    tl.to(lbls, { autoAlpha: 1, duration: 0.5 }, '-=0.4');
  });

  /* 7. Explorer: folders open and close smoothly instead of snapping */
  window.__gsapFolder = function (li, row) {
    var ul = li.querySelector(':scope > ul'), chev = row.querySelector('.chev');
    if (!ul) return;
    var closing = !li.classList.contains('closed');
    row.setAttribute('aria-expanded', String(!closing));
    if (closing) {
      gsap.to(chev, { rotation: -90, duration: 0.35, ease: 'power2.inOut' });
      gsap.to(ul, { height: 0, autoAlpha: 0, overflow: 'hidden', duration: 0.35, ease: 'power2.inOut',
        onComplete: function () { li.classList.add('closed'); gsap.set([ul, chev], { clearProps: 'all' }); } });
    } else {
      li.classList.remove('closed');
      gsap.fromTo(chev, { rotation: -90 }, { rotation: 0, duration: 0.45, ease: EASE, clearProps: 'transform' });
      gsap.from(ul, { height: 0, autoAlpha: 0, overflow: 'hidden', duration: 0.5, ease: EASE, clearProps: 'height,opacity,visibility,overflow' });
    }
  };

  /* Keep measurements right after fonts load, and when the sidebar changes width */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ScrollTrigger.refresh(); });
  addEventListener('load', function () { ScrollTrigger.refresh(); });
  /* Parts that build late change the page height; re-measure so reveals near the end still fire */
  var rT; new ResizeObserver(function () { clearTimeout(rT); rT = setTimeout(function () { ScrollTrigger.refresh(); }, 200); }).observe(document.body);
  new MutationObserver(function (m) {
    m.forEach(function (r) {
      if (r.attributeName === 'data-sb') setTimeout(function () { ScrollTrigger.refresh(); }, 500);
      if (r.attributeName === 'data-motion') location.reload(); /* simplest honest way to hand motion back */
    });
  }).observe(root, { attributes: true, attributeFilter: ['data-sb', 'data-motion'] });
})();
</script>

<script data-slot="0095">
(function () {
  "use strict";

  var root = document.documentElement;
  function lv() { var m = root.dataset.motion || "lively"; if (matchMedia("(prefers-reduced-motion: reduce)").matches) m = "off"; return m; }

    clearTimeout(ft);
    if (ok) { code.classList.add(moving() ? "sweep" : "flash"); if (!moving()) ft = setTimeout(function () { code.classList.remove("flash"); }, 600); }

  });

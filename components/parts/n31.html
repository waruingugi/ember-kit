<script data-slot="0035">
(function () {
  "use strict";
  var box = document.getElementById("n31"); if (!box) return;
  var root = document.documentElement;
  function lv() { var m = root.dataset.motion || "lively"; if (matchMedia("(prefers-reduced-motion: reduce)").matches) m = "off"; return m; }
  function $(s, el) { return (el || box).querySelector(s); }
  function $$(s, el) { return [].slice.call((el || box).querySelectorAll(s)); }
  var note = $("#n31-note");
  function count() { var n = $$('[role="switch"][aria-checked="true"]').length, c = $('[role="checkbox"]').getAttribute("aria-checked") === "true"; note.textContent = n + (n === 1 ? " alert on" : " alerts on") + (c ? ", copied to your accountant." : "."); }
  $$('[role="switch"], [role="checkbox"]').forEach(function (b) {
    b.addEventListener("click", function () { b.setAttribute("aria-checked", b.getAttribute("aria-checked") === "true" ? "false" : "true"); count(); });
    var l = document.getElementById(b.getAttribute("aria-labelledby"));
    if (l) l.addEventListener("click", function () { b.click(); b.focus(); });
  });
})();
</script>

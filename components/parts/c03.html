<!-- part c03 | part | group charts | Sign-ups by channel, month by month. | Sign-ups by channel, month by month. -->
<div class="kit kit-part">
          <h3 class="kit-h">Sign-ups by channel, <em>month by month.</em></h3>
          <p class="kit-p">Switch between side by side and stacked, or tap a channel in the key to hide it.</p>
          <section class="cs" id="c03">
    <div class="frame">
      <div class="fbar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="t">Sign-ups · sample data</span></div>
      <div class="fbody">
        <div class="readout">
          <div>
            <p class="label">Sign-ups, Jan to Jun</p>
            <p class="big" style="margin-top:10px"><span id="bcTotal">—</span></p>
          </div>
          <div class="tabs" id="bcMode" role="group" aria-label="Bar layout">
            <button type="button" aria-pressed="true">Side by side</button>
            <button type="button" aria-pressed="false">Stacked</button>
          </div>
        </div>
        <div class="wrap" id="bcWrap" style="height:280px" data-hover="0">
          <svg id="bcSvg" role="img" tabindex="0" aria-label="Sign-ups by month and source. Use left and right arrows to read each month.">
            <g class="grid" id="bcGrid"></g>
            <rect class="bc-band" id="bcBand" x="0" y="0" rx="6"></rect>
            <g id="bcBars"></g>
            <g id="bcX"></g>
            <rect id="bcHit" x="0" y="0" fill="transparent" style="touch-action:pan-y"></rect>
          </svg>
          <div class="stip bc-tip" id="bcTip" aria-hidden="true"></div>
        </div>
        <div class="bc-legend" id="bcLegend" role="group" aria-label="Show or hide a source"></div>
        <details>
          <summary>Show these numbers as a table</summary>
          <table class="readings"><thead><tr><th scope="col">Month</th><th scope="col">Direct</th><th scope="col">Referral</th><th scope="col">Search</th></tr></thead><tbody id="bcRows"></tbody></table>
        </details>
      </div>
    </div>
</section>
        </div>
<script data-slot="0007" data-block="0000">
  /* ---------------- 03 bar chart ---------------- */
  (function () {
    var wrap = $("bcWrap"), svg = $("bcSvg"), gBars = $("bcBars"), gGrid = $("bcGrid"), gX = $("bcX"), band = $("bcBand"), hit = $("bcHit"), tip = $("bcTip");
    var M = { l: 44, t: 12, r: 8, b: 26 };
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
    var S = [
      { name: "Direct", c: "var(--accent)", d: [420, 380, 510, 560, 610, 700] },
      { name: "Referral", c: "var(--ink-soft)", d: [260, 300, 280, 350, 390, 420] },
      { name: "Search", c: "var(--dim)", d: [180, 210, 260, 240, 300, 330] }
    ];
    var mode = "group", on = [true, true, true], hov = -1, shown = false;
    var groups = [], paths = [], cur = [], from = [], to = [], xTicks = [], anim = 0;
    var W = 0, H = 0, bandW = 0, base = 0;

    months.forEach(function (m, gi) {
      var g = document.createElementNS(NS, "g"); g.setAttribute("class", "bc-g"); gBars.appendChild(g); groups.push(g);
      paths[gi] = []; cur[gi] = [];
      S.forEach(function (s, si) {
        var p = document.createElementNS(NS, "path"); p.style.fill = s.c; g.appendChild(p); paths[gi][si] = p;
        cur[gi][si] = { x: 0, y: 0, w: 0, h: 0, r: 4 };
      });
    });
    $("bcRows").innerHTML = months.map(function (m, i) { return "<tr><td>" + m + "</td>" + S.map(function (s) { return "<td>" + fmt(s.d[i]) + "</td>"; }).join("") + "</tr>"; }).join("");

    function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(raw))); var f = [1, 2, 2.5, 5, 10].find(function (x) { return x * p >= raw; }); return f * p; }
    function barPath(b) {
      if (b.h <= .2 || b.w <= .2) return "";
      var r = Math.min(b.r, b.w / 2, b.h), x = b.x, y = b.y, w = b.w, h = b.h;
      return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
    }
    function targets() {
      var vis = S.map(function (s, i) { return i; }).filter(function (i) { return on[i]; });
      var max = 0;
      months.forEach(function (m, gi) {
        if (mode === "group") vis.forEach(function (si) { max = Math.max(max, S[si].d[gi]); });
        else max = Math.max(max, vis.reduce(function (a, si) { return a + S[si].d[gi]; }, 0));
      });
      var step = niceStep(max / 4), top = Math.ceil(max / step) * step;
      var ph = H - M.t - M.b, pw = W - M.l - M.r;
      base = M.t + ph; bandW = pw / months.length;
      var y = function (v) { return M.t + ph - v / top * ph; };
      var n = vis.length, bw = Math.min(26, (bandW * .72 - (n - 1) * 2) / n), gw = n * bw + (n - 1) * 2, sw = Math.min(40, bandW * .44);
      var t = [];
      months.forEach(function (m, gi) {
        var cx = M.l + bandW * (gi + .5), acc = 0, topSi = -1;
        vis.forEach(function (si) { topSi = si; });
        t[gi] = S.map(function (s, si) {
          var v = s.d[gi], c = cur[gi][si];
          if (mode === "group") {
            var k = vis.indexOf(si);
            if (k < 0) return { x: c.x, y: base, w: c.w, h: 0, r: 4 };
            return { x: cx - gw / 2 + k * (bw + 2), y: y(v), w: bw, h: base - y(v), r: 4 };
          }
          if (!on[si]) return { x: cx - sw / 2, y: y(acc), w: sw, h: 0, r: 0 };
          var y0 = y(acc + v), y1 = y(acc) - (acc > 0 ? 2 : 0);
          acc += v;
          return { x: cx - sw / 2, y: y0, w: sw, h: Math.max(0, y1 - y0), r: si === topSi ? 4 : 0 };
        });
      });
      return { t: t, top: top, step: step, y: y };
    }
    function draw() { months.forEach(function (m, gi) { S.forEach(function (s, si) { paths[gi][si].setAttribute("d", barPath(cur[gi][si])); }); }); }
    function axes(T) {
      gGrid.textContent = ""; gX.textContent = ""; xTicks = [];
      for (var v = 0; v <= T.top + 1e-9; v += T.step) {
        var yy = Math.round(T.y(v)) + .5;
        var ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", M.l); ln.setAttribute("x2", W - M.r); ln.setAttribute("y1", yy); ln.setAttribute("y2", yy);
        if (v === 0) ln.setAttribute("class", "base");
        var tx = document.createElementNS(NS, "text");
        tx.setAttribute("class", "tick fd"); tx.setAttribute("x", M.l - 8); tx.setAttribute("y", yy + 4); tx.setAttribute("text-anchor", "end");
        tx.textContent = fmt(v);
        gGrid.appendChild(ln); gGrid.appendChild(tx);
      }
      months.forEach(function (m, gi) {
        var tx = document.createElementNS(NS, "text");
        tx.setAttribute("class", "tick"); tx.setAttribute("x", M.l + bandW * (gi + .5)); tx.setAttribute("y", H - 6); tx.setAttribute("text-anchor", "middle");
        tx.textContent = m; gX.appendChild(tx); xTicks.push(tx);
      });
    }
    function go(stagger) {
      var T = targets(); axes(T); to = T.t;
      $("bcTotal").textContent = fmt(S.reduce(function (a, s, si) { return a + (on[si] ? s.d.reduce(function (x, y) { return x + y; }, 0) : 0); }, 0));
      cancelAnimationFrame(anim);
      var k = spd();
      if (!k || !shown) { cur = to.map(function (g) { return g.map(function (b) { return Object.assign({}, b); }); }); if (shown) draw(); return; }
      from = cur.map(function (g) { return g.map(function (b) { return Object.assign({}, b); }); });
      var dur = 550 * (k < 1 ? .6 : 1), t0 = performance.now();
      (function frame(now) {
        var done = true;
        months.forEach(function (m, gi) {
          var p = clamp((now - t0 - (stagger ? gi * 30 : 0)) / dur, 0, 1), e = ease(p);
          if (p < 1) done = false;
          S.forEach(function (s, si) {
            var a = from[gi][si], b = to[gi][si];
            cur[gi][si] = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, w: a.w + (b.w - a.w) * e, h: a.h + (b.h - a.h) * e, r: b.r };
          });
        });
        draw();
        if (!done) anim = requestAnimationFrame(frame);
      })(t0);
    }
    function size() {
      W = wrap.clientWidth; H = wrap.clientHeight;
      svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", W); svg.setAttribute("height", H);
      hit.setAttribute("x", M.l); hit.setAttribute("y", M.t); hit.setAttribute("width", Math.max(0, W - M.l - M.r)); hit.setAttribute("height", Math.max(0, H - M.t - M.b));
      band.setAttribute("y", M.t); band.setAttribute("height", H - M.t - M.b);
      var keep = shown; shown = false; go(false); shown = keep;
      if (shown) draw();
      else months.forEach(function (m, gi) { S.forEach(function (s, si) { cur[gi][si] = { x: to[gi][si].x, y: base, w: to[gi][si].w, h: 0, r: to[gi][si].r }; }); });
      band.setAttribute("width", Math.max(0, bandW - 8));
      if (hov >= 0) show(hov);
    }
    function show(gi) {
      hov = gi; wrap.dataset.hover = gi < 0 ? "0" : "1";
      groups.forEach(function (g, j) { g.style.opacity = gi < 0 || j === gi ? 1 : .38; });
      xTicks.forEach(function (t, j) { t.classList.toggle("on", j === gi); });
      band.style.opacity = gi < 0 ? 0 : 1;
      if (gi < 0) return;
      band.style.transform = "translateX(" + (M.l + bandW * gi + 4) + "px)";
      var tot = 0, rows = S.map(function (s, si) {
        if (!on[si]) return "";
        tot += s.d[gi];
        return '<li><span><i class="sw" style="--c:' + s.c + '"></i>' + s.name + "</span><b>" + fmt(s.d[gi]) + "</b></li>";
      }).join("");
      tip.innerHTML = '<p class="d">' + months[gi] + " 2026</p><ul>" + rows + "</ul>" + (mode === "stack" ? '<p class="tot"><span>Total</span><b>' + fmt(tot) + "</b></p>" : "");
      var tw = tip.offsetWidth, cx = M.l + bandW * (gi + .5), x = cx + bandW / 2 + 4;
      if (x + tw > W) x = cx - bandW / 2 - 4 - tw;
      tip.style.transform = "translate(" + Math.max(0, x) + "px," + M.t + "px)";
    }
    hit.addEventListener("pointermove", function (e) {
      var r = svg.getBoundingClientRect();
      show(clamp(Math.floor((e.clientX - r.left - M.l) / bandW), 0, months.length - 1));
    });
    hit.addEventListener("pointerleave", function () { if (document.activeElement !== svg) show(-1); });
    svg.addEventListener("keydown", function (e) {
      var k = e.key, i = hov < 0 ? 0 : hov;
      if (k === "ArrowRight") i = Math.min(months.length - 1, hov + 1);
      else if (k === "ArrowLeft") i = Math.max(0, hov - 1);
      else if (k === "Home") i = 0; else if (k === "End") i = months.length - 1;
      else if (k === "Escape") { show(-1); return; } else return;
      e.preventDefault(); show(i);
    });
    svg.addEventListener("focus", function () { if (hov < 0) show(0); });
    svg.addEventListener("blur", function () { show(-1); });

    tabs($("bcMode"), ["Side by side", "Stacked"], { onSelect: function (i) { mode = i ? "stack" : "group"; go(false); if (hov >= 0) show(hov); } });
    var leg = $("bcLegend");
    leg.innerHTML = S.map(function (s, i) { return '<button type="button" aria-pressed="true" data-i="' + i + '"><i class="sw" style="--c:' + s.c + '"></i>' + s.name + "</button>"; }).join("");
    leg.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var i = +b.dataset.i;
      if (on[i] && on.filter(Boolean).length === 1) return; // keep at least one source
      on[i] = !on[i]; b.setAttribute("aria-pressed", String(on[i]));
      go(false); if (hov >= 0) show(hov);
    });

    size();
    if ("ResizeObserver" in window) new ResizeObserver(function () { if (wrap.clientWidth !== W) size(); }).observe(wrap);
    onView(wrap, function () { shown = true; go(true); }, .4);
  })();
</script>

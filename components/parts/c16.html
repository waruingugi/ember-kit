      { n: "Lumen Labs", d: "lumen.dev", s: ["wait", "Pending"], mrr: 1150, seats: 6, own: "Sam Reid", plan: "Team", since: "Oct 2026", reg: "North America" },
      { n: "Harbor & Co", d: "harbor.co", s: ["off", "Paused"], mrr: 860, seats: 4, own: "Priya Nair", plan: "Team", since: "Jan 2025", reg: "Europe" },

      { n: "Quill Studio", d: "quill.studio", s: ["hot", "Churned"], mrr: 0, seats: 0, own: "Maya Ortiz", plan: "Starter", since: "May 2024", reg: "North America" }

        '<section class="xr-card"><span class="label">Details</span><div class="kv"><span>Owner</span><span>' + a.own + '</span></div><div class="kv"><span>Plan</span><span>' + a.plan + '</span></div><div class="kv"><span>Customer since</span><span>' + a.since + '</span></div><div class="kv"><span>Region</span><span>' + a.reg + "</span></div></section>" +

    var btns = [].slice.call(box.querySelectorAll(".xr-btn"));
    function set(b, open) {
      b.setAttribute("aria-expanded", String(open));
      b.parentNode.classList.toggle("open", open);
      var body = $(b.getAttribute("aria-controls")); body.hidden = !open;
      if (open && spd()) [].forEach.call(body.children, function (c, k) { c.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: k * 40, easing: EASE, fill: "backwards" }); });

      all.textContent = n === btns.length ? "Close all" : "Open all";
    }
    box.addEventListener("click", function (e) {
      var b = e.target.closest(".xr-btn"); if (b) { set(b, b.getAttribute("aria-expanded") !== "true"); return; }

    });
    all.addEventListener("click", function () { var open = all.textContent === "Open all"; btns.forEach(function (b) { set(b, open); }); });
  })();
</script>

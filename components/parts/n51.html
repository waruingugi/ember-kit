<script data-slot="0055">
(function () {
  "use strict";
  var box = document.getElementById("n51"); if (!box) return;
  function $(s, el) { return (el || box).querySelector(s); }
  function $$(s, el) { return [].slice.call((el || box).querySelectorAll(s)); }
  /* Waits 120 ms before the first label; for 300 ms after you leave, the next one shows at once. */
  var tip = $("#n51-tip"), tx = $(".tx", tip), t = null, warm = 0;
  function show(b, now) {
    clearTimeout(t);
    var go = function () { tx.textContent = b.getAttribute("aria-label"); var k = document.createElement("span"); k.className = "k"; k.textContent = b.getAttribute("data-k"); tx.appendChild(k); tip.style.setProperty("--x", (b.offsetLeft + b.offsetWidth / 2) + "px"); tip.classList.add("on"); };
    if (now || performance.now() < warm || tip.classList.contains("on")) go(); else t = setTimeout(go, 120);
  }
  function hide() { clearTimeout(t); if (tip.classList.contains("on")) warm = performance.now() + 300; tip.classList.remove("on"); }
  $$(".bar .b").forEach(function (b) {
    b.addEventListener("pointerenter", function () { show(b); }); b.addEventListener("pointerleave", hide);
    b.addEventListener("focus", function () { show(b, true); }); b.addEventListener("blur", hide); b.addEventListener("click", hide);
    b.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
  });
})();
</script>
